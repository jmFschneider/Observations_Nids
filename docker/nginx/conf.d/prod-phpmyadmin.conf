# Configuration Nginx - phpMyAdmin (accès ponctuel sécurisé)
# Activer/désactiver via : docker/scripts/enable-phpmyadmin.sh / disable-phpmyadmin.sh
#
# Double protection :
#   1. HTTP Basic Auth (login/mot de passe)
#   2. Le container phpMyAdmin doit être démarré (sinon 502)

server {
    listen 443 ssl;
    http2 on;
    server_name observation-nids.meteo-poelley50.fr;

    ssl_certificate     /etc/letsencrypt/live/observation-nids.meteo-poelley50.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/observation-nids.meteo-poelley50.fr/privkey.pem;

    # Résolution DNS Docker (nécessaire pour proxy vers container optionnel)
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /phpmyadmin/ {
        # Protection par login/mot de passe
        auth_basic "Accès restreint - Administration BDD";
        auth_basic_user_file /etc/nginx/auth/.htpasswd;

        # Proxy vers phpMyAdmin (résolution dynamique via variable)
        set $phpmyadmin http://observations_phpmyadmin:80;
        proxy_pass $phpmyadmin/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Pas de mise en cache pour l'admin
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Cache-Control "no-store, no-cache";
    }
}
