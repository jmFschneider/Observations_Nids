# Configuration Nginx - Production OVH
# SSL géré directement par Nginx (pas de reverse proxy Apache devant)

upstream django_app {
    server web:8000;
}

# HTTP - Redirect vers HTTPS + challenge Let's Encrypt pour renouvellement
server {
    listen 80;
    server_name observation-nids.meteo-poelley50.fr;

    # ACME challenge pour certbot (renouvellement des certificats)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Tout le reste → HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS - Serveur principal
server {
    listen 443 ssl;
    http2 on;
    server_name observation-nids.meteo-poelley50.fr;

    # Certificats Let's Encrypt
    ssl_certificate     /etc/letsencrypt/live/observation-nids.meteo-poelley50.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/observation-nids.meteo-poelley50.fr/privkey.pem;

    # Paramètres SSL recommandés
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Résolution DNS Docker (nécessaire pour proxy vers container optionnel phpMyAdmin)
    resolver 127.0.0.11 valid=10s ipv6=off;

    charset utf-8;
    client_max_body_size 100M;

    access_log /var/log/nginx/observations_access.log;
    error_log  /var/log/nginx/observations_error.log;

    # Fichiers statiques
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Fichiers media
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Health check (pas de log pour ne pas polluer)
    location /health/ {
        proxy_pass http://django_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # Application Django
    location / {
        proxy_pass http://django_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # $scheme vaut "https" ici car Nginx gère SSL directement
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 120;
        proxy_send_timeout 120;
        proxy_read_timeout 120;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # phpMyAdmin (container optionnel, démarré via enable-phpmyadmin.sh)
    location /phpmyadmin/ {
        auth_basic "Accès restreint - Administration BDD";
        auth_basic_user_file /etc/nginx/auth/.htpasswd;

        # set doit être AVANT rewrite (rewrite ... break stoppe les directives du module rewrite)
        set $phpmyadmin http://observations_phpmyadmin:80;
        rewrite ^/phpmyadmin/(.*) /$1 break;
        proxy_pass $phpmyadmin;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Cache-Control "no-store, no-cache";
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
}
