{% extends 'base.html' %}

{% block title %}Créer une espèce{% endblock %}

{% block content %}
<div class="container-fluid mt-4">
    <div class="row">
        <div class="col-lg-8 offset-lg-2">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1><i class="fas fa-plus"></i> Créer une nouvelle espèce</h1>
                <a href="{% url 'taxonomy:liste_especes' %}" class="btn btn-secondary">
                    <i class="fas fa-arrow-left"></i> Annuler
                </a>
            </div>

            {% if messages %}
            {% for message in messages %}
            <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            {% endfor %}
            {% endif %}

            <div class="card">
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}

                        <table class="table mb-0">
                            <tr>
                                <td style="width: 200px; vertical-align: middle;">
                                    <label for="nom" class="form-label mb-0">Nom français *</label>
                                </td>
                                <td>
                                    <input type="text" class="form-control" id="nom" name="nom" required>
                                </td>
                            </tr>
                            <tr>
                                <td style="vertical-align: middle;">
                                    <label for="nom_scientifique" class="form-label mb-0">Nom scientifique *</label>
                                </td>
                                <td>
                                    <input type="text" class="form-control" id="nom_scientifique" name="nom_scientifique" required>
                                </td>
                            </tr>
                            <tr>
                                <td style="vertical-align: middle;">
                                    <label for="nom_anglais" class="form-label mb-0">Nom anglais</label>
                                </td>
                                <td>
                                    <input type="text" class="form-control" id="nom_anglais" name="nom_anglais">
                                </td>
                            </tr>
                            <tr>
                                <td style="vertical-align: middle;">
                                    <label for="code_gonm" class="form-label mb-0">Code GONM</label>
                                </td>
                                <td>
                                    <input type="text" class="form-control" id="code_gonm" name="code_gonm" maxlength="10">
                                </td>
                            </tr>
                            <tr>
                                <td style="vertical-align: middle;">
                                    <label for="famille" class="form-label mb-0">Famille</label>
                                </td>
                                <td>
                                    <select class="form-select" id="famille" name="famille">
                                        <option value="">-- Sélectionner une famille --</option>
                                        {% for famille in familles %}
                                        <option value="{{ famille.id }}">{{ famille.nom }} ({{ famille.ordre.nom }})</option>
                                        {% endfor %}
                                    </select>
                                </td>
                            </tr>
                            <tr>
                                <td style="vertical-align: middle;">
                                    <label for="statut" class="form-label mb-0">Statut</label>
                                </td>
                                <td>
                                    <input type="text" class="form-control" id="statut" name="statut" placeholder="A, B, C, etc.">
                                </td>
                            </tr>
                            <tr>
                                <td style="vertical-align: middle;">
                                    <label for="lien_oiseau_net" class="form-label mb-0">Lien Oiseaux.net</label>
                                </td>
                                <td>
                                    <input type="url" class="form-control" id="lien_oiseau_net" name="lien_oiseau_net">
                                </td>
                            </tr>
                            <tr>
                                <td style="vertical-align: top;">
                                    <label for="commentaire" class="form-label mb-0">Commentaire</label>
                                </td>
                                <td>
                                    <textarea class="form-control" id="commentaire" name="commentaire" rows="3"></textarea>
                                </td>
                            </tr>
                            <tr>
                                <td></td>
                                <td>
                                    <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-3">
                                        <a href="{% url 'taxonomy:liste_especes' %}" class="btn btn-secondary">
                                            <i class="fas fa-times"></i> Annuler
                                        </a>
                                        <button type="submit" class="btn btn-success">
                                            <i class="fas fa-save"></i> Créer l'espèce
                                        </button>
                                    </div>
                                </td>
                            </tr>
                        </table>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
