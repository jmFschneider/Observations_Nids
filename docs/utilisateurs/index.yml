# Index de navigation - Documentation utilisateur
# Observations Nids - v1.1 (Décembre 2025)

meta:
  title: "Documentation utilisateur - Observations Nids"
  version: "1.1"
  date: "2025-12-29"
  description: "Guide complet pour utiliser l'application Observations Nids"

# ========================================
# NAVIGATION PRINCIPALE
# ========================================

navigation:
  accueil:
    titre: "🏠 Page d'accueil"
    fichier: "README.md"
    description: "Vue d'ensemble et point d'entrée de la documentation"
    mots_cles: ["introduction", "démarrage", "vue d'ensemble"]

  guide_rapide:
    titre: "⚡ Guide rapide (5 minutes)"
    fichier: "00_guide_rapide.md"
    description: "Démarrez rapidement avec l'essentiel"
    priorite: "haute"
    pour_qui: ["nouveaux utilisateurs", "découverte rapide"]
    mots_cles: ["démarrage", "rapide", "tutoriel", "quickstart"]

# ========================================
# GUIDES DÉTAILLÉS
# ========================================

guides:
  navigation:
    titre: "📍 Navigation générale"
    fichier: "01_navigation_generale.md"
    description: "Comprendre l'interface et les rôles"
    sections:
      - "Inscription et connexion"
      - "Menu et navigation"
      - "Rôles et permissions"
      - "Cycle de vie d'une fiche"
    mots_cles: ["menu", "interface", "rôles", "permissions", "statuts"]

  saisie:
    titre: "📝 Saisir une nouvelle fiche"
    fichier: "02_saisie_nouvelle_observation.md"
    description: "Guide complet de création de fiche"
    sections:
      - "Localisation (communes optimisées)"
      - "Enregistrement initial"
      - "Informations du nid"
      - "Ajout d'observations"
      - "Remarques"
      - "Validation"
    nouveautes:
      - "Recherche de communes par pertinence"
      - "Barre d'actions flottante"
      - "Fiche ID / N° perso de fiche"
    mots_cles: ["créer", "saisir", "observation", "fiche", "nid", "commune"]

  correction:
    titre: "✏️ Correction et transcription"
    fichier: "03_correction_transcription.md"
    description: "Transcrire et corriger des carnets papier"
    sections:
      - "Préparation des images"
      - "Upload et sélection"
      - "Lancement OCR"
      - "Suivi du traitement"
      - "Correction des fiches"
    pour_qui: ["correcteurs", "utilisateurs avancés"]
    mots_cles: ["transcription", "OCR", "IA", "correction", "carnets"]

  support:
    titre: "🎫 Support et tickets"
    fichier: "04_support_tickets.md"
    description: "Obtenir de l'aide et signaler des problèmes"
    mots_cles: ["aide", "support", "ticket", "bug", "problème"]

  glossaire:
    titre: "📖 Glossaire"
    fichier: "05_glossaire.md"
    description: "Définitions des termes techniques"
    nouveautes:
      - "Fiche ID"
      - "N° perso de fiche"
      - "Barre d'actions flottantes"
      - "Tri par pertinence"
    mots_cles: ["définitions", "termes", "vocabulaire", "acronymes"]

# ========================================
# PARCOURS PAR PROFIL UTILISATEUR
# ========================================

parcours:
  nouveau_utilisateur:
    titre: "🆕 Je débute"
    ordre_lecture:
      - fichier: "00_guide_rapide.md"
        temps: "5 minutes"
        description: "Découverte rapide"
      - fichier: "01_navigation_generale.md"
        temps: "10 minutes"
        description: "Comprendre l'interface"
      - fichier: "02_saisie_nouvelle_observation.md"
        temps: "15 minutes"
        description: "Créer ma première fiche"
      - fichier: "05_glossaire.md"
        temps: "Consultation"
        description: "Référence des termes"

  observateur:
    titre: "🐦 Je suis observateur"
    ordre_lecture:
      - fichier: "02_saisie_nouvelle_observation.md"
        focus: ["Localisation", "Observations", "Enregistrement"]
      - fichier: "01_navigation_generale.md"
        focus: ["Cycle de vie", "Permissions"]
      - fichier: "04_support_tickets.md"
        focus: ["Signaler un problème"]

  correcteur:
    titre: "✅ Je suis correcteur"
    ordre_lecture:
      - fichier: "03_correction_transcription.md"
        focus: ["Transcription OCR", "Correction"]
      - fichier: "01_navigation_generale.md"
        focus: ["Rôles", "Permissions"]
      - fichier: "02_saisie_nouvelle_observation.md"
        focus: ["Validation"]

