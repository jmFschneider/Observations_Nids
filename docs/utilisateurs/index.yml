# ========================================
# LIENS RAPIDES PAR BESOIN
# ========================================

liens_rapides:
  problemes_frequents:
    titre: "❓ Problèmes fréquents"
    liens:
      - question: "Ma commune n'est pas trouvée"
        fichier: "00_guide_rapide.md#erreurs-courantes"
        reponse: "Recherche optimisée - tapez au moins 2 lettres"

      - question: "Je ne peux pas ajouter d'observations"
        fichier: "02_saisie_nouvelle_observation.md#questions-frequentes"
        reponse: "Enregistrer la fiche d'abord"

      - question: "Mes données ont disparu"
        fichier: "01_navigation_generale.md#problemes-courants"
        reponse: "Toujours enregistrer régulièrement"

      - question: "La géolocalisation ne marche pas"
        fichier: "02_saisie_nouvelle_observation.md#questions-frequentes"
        reponse: "Vérifier autorisations GPS"

  actions_courantes:
    titre: "⚡ Actions courantes"
    liens:
      - action: "Créer une nouvelle fiche"
        fichier: "00_guide_rapide.md#etape-2"
        raccourci: "Menu → Fiches Observations → Nouvelle fiche"

      - action: "Ajouter une observation à un nid existant"
        fichier: "00_guide_rapide.md#actions-courantes"
        etapes: ["Liste → Fiche → Modifier → + Observation"]

      - action: "Soumettre pour validation"
        fichier: "02_saisie_nouvelle_observation.md#validation"
        prerequis: "Fiche complète à 80%"

      - action: "Transcrire un carnet"
        fichier: "03_correction_transcription.md"
        prerequis: "Images JPEG de bonne qualité"

