site_name: Observations Nids - Documentation
site_description: Documentation complète (Utilisateurs & Développeurs) pour l'application Observations Nids
dev_addr: '127.0.0.1:8001'

# Racine de la documentation = dossier courant (docs/)
docs_dir: .
site_dir: ../site-user

# Thème
theme:
  name: material
  language: fr
  logo: assets/images/logo.png # (Si existe, sinon à ajouter plus tard)
  icon:
    repo: fontawesome/brands/github
  palette:
    - scheme: default
      primary: green
      accent: light-green
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.prune
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - toc.follow

# Assets centralisés
extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/navigation.js
  - https://unpkg.com/mermaid@10.6.1/dist/mermaid.min.js

# Plugins
plugins:
  - search:
      lang: fr
      separator: '[\s\-\.]'

# Extensions Markdown
markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details

