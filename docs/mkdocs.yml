site_name: Observations Nids - Documentation
site_description: Documentation du projet Observations Nids - Gestion des fiches d'observation de nidification
site_author: GONM
dev_addr: '127.0.0.1:8001'

# Racine de la documentation
docs_dir: .
site_dir: ../site-user

# Thème Material
theme:
  name: material
  language: fr
  icon:
    repo: fontawesome/brands/github
  palette:
    - scheme: default
      primary: green
      accent: light-green
      toggle:
        icon: material/brightness-7
        name: Mode sombre
    - scheme: slate
      primary: green
      accent: light-green
      toggle:
        icon: material/brightness-4
        name: Mode clair
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow

# Plugins
plugins:
  - search:
      lang: fr
      separator: '[\s\-\.]'

# Extensions Markdown
markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - attr_list
  - md_in_html

# Navigation
nav:
  - Accueil: README.md

  - Guide Utilisateur:
    - Saisie d'observations: guides/utilisateur/saisie_observation.md

  - Architecture:
    - Vue d'ensemble: guides/architecture.md
    - Applications Django:
      - Observations: applications/observations.md
      - Formulaires de saisie: applications/observations_saisie_formulaires.md
      - Taxonomy: applications/taxonomy.md
      - Geo: applications/geo.md
      - Accounts: applications/accounts.md
      - Review: applications/review.md
      - Audit: applications/audit.md
      - Ingest: applications/ingest.md
      - OCR: applications/ocr.md
      - Core: applications/core.md

  - Guides Techniques:
    - Workflow d'une fiche: guides/workflow_fiche.md
    - Permissions: guides/permissions.md
    - OCR Gemini: guides/ocr_gemini.md

  - Déploiement:
    - Linux et Windows: deploiement/deploiement_linux_windows.md
    - Docker: deploiement/deploiement_docker.md

  - Projet:
    - Plan directeur: projet/docs_todo.md
    - Index des fichiers clés: projet/fichiers_cles.md
    - Stratégie documentation: projet/strategie.md
    - Template: projet/template.md

# Extra
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/gonm
